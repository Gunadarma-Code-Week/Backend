<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Subject }}</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .header {
            background-color: #0f172a;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .content {
            padding: 40px 30px;
            color: #334155;
        }
        .content p {
            margin-bottom: 20px;
            font-size: 16px;
        }
        .message-body {
            white-space: pre-wrap;
            margin-bottom: 25px;
        }
        .contact-box {
            background-color: #f8fafc;
            border-left: 4px solid #2563eb;
            padding: 20px;
            margin: 30px 0;
            border-radius: 0 6px 6px 0;
        }
        .contact-box p {
            margin: 5px 0;
            font-size: 15px;
        }
        .footer {
            background-color: #f1f5f9;
            padding: 25px 20px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Announcement</h1>
        </div>
        <div class="content">
            <p><strong>Hello {{ .TeamName }},</strong></p>
            
            <div class="message-body">{{ .Content }}</div>

            <div class="contact-box">
                <p style="margin-top: 0;"><strong>Have any questions? Feel free to contact us:</strong></p>
                <p>Email: <a href="mailto:gcwgunadarma@gmail.com" style="color: #2563eb; text-decoration: none;">gcwgunadarma@gmail.com</a></p>
                <p>Instagram: <a href="https://instagram.com/gunadarmacodeweek" style="color: #2563eb; text-decoration: none;">@gunadarmacodeweek</a></p>
            </div>
        </div>
        <div class="footer">
            <p style="margin: 0;">Best regards,</p>
            <p style="margin: 5px 0 0 0; font-weight: 600;">Public Relations Team<br>Gunadarma Code Week</p>
        </div>
    </div>
</body>
</html>
