version: "3.8"

services:
  adminer:
    image: adminer
    environment:
      - ADMINER_DESIGN=pepa-linha
    ports:
      - "8081:8080"
    networks:
      - gcw-network
    depends_on:
      db:
        condition: service_healthy
    
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data-staging:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - gcw-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.staging
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    networks:
      - gcw-network
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data-staging:
    driver: local

networks:
  gcw-network:
    driver: bridge
