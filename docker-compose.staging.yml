services:
  adminer:
    image: adminer
    environment:
      - ADMINER_DESIGN=pepa-linha
    ports:
      - "8082:8080"
    networks:
      - gcw-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data-staging:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - gcw-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.staging
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      VERSION: ${VERSION}
      APP_NAME: ${APP_NAME}
      PORT: ${PORT}
      MODE: ${MODE}
      HOST_HEADER: ${HOST_HEADER}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      API_BASE_URL: ${API_BASE_URL}
      ADMIN_API_BASE_URL: ${ADMIN_API_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      DOMJUDGE_URL: ${DOMJUDGE_URL}
      DOMJUDGE_CONTEST_ID: ${DOMJUDGE_CONTEST_ID}
      DOMJUDGE_USERNAME: ${DOMJUDGE_USERNAME}
      DOMJUDGE_PASSWORD: ${DOMJUDGE_PASSWORD}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      MIDTRANS_ENVIRONMENT: ${MIDTRANS_ENVIRONMENT}
      MIDTRANS_ACTIVE: ${MIDTRANS_ACTIVE}

      # Registration Fees
      HACKATHON_FEE: ${HACKATHON_FEE}
      CP_FEE: ${CP_FEE}
      CTF_FEE: ${CTF_FEE}

      # Stellar Blockchain Audit Log
      STELLAR_NETWORK: ${STELLAR_NETWORK}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL}
      STELLAR_SECRET_KEY: ${STELLAR_SECRET_KEY}
      STELLAR_CONTRACT_ADDRESS: ${STELLAR_CONTRACT_ADDRESS}

      # JWT Keys
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      AUDIT_PRIVATE_KEY_PATH: ${AUDIT_PRIVATE_KEY_PATH}
      AUDIT_DESCRIPTION_KEY_PATH: ${AUDIT_DESCRIPTION_KEY_PATH}
    # ports:
    #   - "8000:8000"
    networks:
      - gcw-network
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data-staging:
    driver: local

networks:
  gcw-network:
    driver: bridge
